# Soliva Maintenance Configuration

# Add this to your main server block in Nginx

# Define maintenance mode variable
# You can toggle this by changing the value below or using the maintenance.sh script
set $maintenance_mode "off"; 

# Check for maintenance trigger file
if (-f /var/www/soliva/maintenance.on) {
    set $maintenance_mode "on";
}

# Redirect to maintenance page if mode is ON
if ($maintenance_mode = "on") {
    return 503;
}

# 503 Error Page (Maintenance)
error_page 503 @maintenance;

location @maintenance {
    rewrite ^(.*)$ /maintenance.html break;
    root /root/Aditya/the-final-Soliva/Frontend/public; # Adjust this to your static assets path
}

# Replace 502/504 Bad Gateway with the maintenance page
error_page 502 504 /maintenance.html;
location = /maintenance.html {
    root /root/Aditya/the-final-Soliva/Frontend/public;
    internal;
}
