version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/soliva
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Note: Include other production secrets via .env file or orchestrator
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - soliva-network

  mongo:
    image: mongo:latest
    # Bind to loopback ONLY. The host app connects via 127.0.0.1:27017; exposing
    # 0.0.0.0 to the internet got this DB ransomwared (READ_ME_TO_RECOVER_YOUR_DATA).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - soliva-network

  redis:
    image: redis:alpine
    # Bind to loopback ONLY — never expose Redis to the public internet.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - soliva-network

volumes:
  mongo-data:
  redis-data:

networks:
  soliva-network:
    driver: bridge
