<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soliva | Scheduled Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Plus+Jakarta+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-base: #A97B4F;
            --text-dark: #2C241B;
            --text-muted: #4A3B2B;
            --accent-gold: #ffffff;
            --font-serif: "Playfair Display", serif;
            --font-sans: "Plus Jakarta Sans", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-dark);
            font-family: var(--font-sans);
        }

        #bg-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #D8C1A0 0%, #C7A27A 55%, #A97B4F 100%);
            z-index: 0;
            opacity: 1;
        }


        #ballpit-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
        }

        .content {
            text-align: center;
            max-width: 700px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-container {
            margin-bottom: 48px;
        }

        .logo-container img {
            height: 70px;
            filter: drop-shadow(0 4px 10px rgba(180,120,40,0.15));
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        p.description {
            color: var(--text-muted);
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 48px;
            font-weight: 300;
        }

        .status-footer {
            padding-top: 32px;
            border-top: 1px solid rgba(67, 57, 43, 0.08);
            color: var(--accent-gold);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 38px; }
            p.description { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="bg-gradient"></div>
    <canvas id="ballpit-canvas"></canvas>
    
    <div id="content-wrapper">
        <div class="content">
            <div class="logo-container">
                <img src="/soliva%20logo_high%20resolution.webp" alt="Soliva Logo">
            </div>

            <h1>Scheduled Maintenance</h1>

            <p class="description">
                We are making improvements to deliver a better Soliva experience.
            </p>

            <div class="status-footer">
                We'll be back shortly.
            </div>
        </div>
    </div>

    <script>
        const colors = ['#FF7A00', '#FF9A3C', '#FFC36A', '#FFE2B8'];
        const canvas = document.getElementById('ballpit-canvas');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1.5);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xFAF6F0, 0.5);
        pointLight2.position.set(-10, -10, 5);
        scene.add(pointLight2);

        const balls = [];
        const count = 120;
        const friction = 0.995;
        const wallBounce = 0.95;
        const minSize = 0.4;
        const maxSize = 1.1;

        const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);

        for (let i = 0; i < count; i++) {
            const size = Math.random() * (maxSize - minSize) + minSize;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.2,
                roughness: 0.1,
                metalness: 0.1
            });

            const mesh = new THREE.Mesh(sphereGeometry, material);
            mesh.scale.set(size, size, size);
            
            // Random start position within view
            const aspect = window.innerWidth / window.innerHeight;
            const visibleHeight = 2 * Math.tan((50 * Math.PI) / 360) * 15;
            const visibleWidth = visibleHeight * aspect;

            mesh.position.x = (Math.random() - 0.5) * visibleWidth;
            mesh.position.y = (Math.random() - 0.5) * visibleHeight;
            mesh.position.z = 0;

            balls.push({
                mesh: mesh,
                vel: new THREE.Vector3((Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.05, 0),
                size: size
            });

            scene.add(mesh);
        }

        const mouse = new THREE.Vector2(-999, -999);
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);

            const aspect = window.innerWidth / window.innerHeight;
            const visibleHeight = 2 * Math.tan((50 * Math.PI) / 360) * 15;
            const visibleWidth = visibleHeight * aspect;

            const worldMouse = new THREE.Vector3(mouse.x * (visibleWidth / 2), mouse.y * (visibleHeight / 2), 0);

            balls.forEach(ball => {
                // Apply velocity
                ball.mesh.position.add(ball.vel);
                
                // Friction
                ball.vel.multiplyScalar(friction);

                // Boundaries
                const limitX = visibleWidth / 2 - ball.size;
                const limitY = visibleHeight / 2 - ball.size;

                if (ball.mesh.position.x > limitX) {
                    ball.mesh.position.x = limitX;
                    ball.vel.x *= -wallBounce;
                } else if (ball.mesh.position.x < -limitX) {
                    ball.mesh.position.x = -limitX;
                    ball.vel.x *= -wallBounce;
                }

                if (ball.mesh.position.y > limitY) {
                    ball.mesh.position.y = limitY;
                    ball.vel.y *= -wallBounce;
                } else if (ball.mesh.position.y < -limitY) {
                    ball.mesh.position.y = -limitY;
                    ball.vel.y *= -wallBounce;
                }

                // Cursor interaction
                const dist = ball.mesh.position.distanceTo(worldMouse);
                if (dist < 3) {
                    const force = new THREE.Vector3().subVectors(ball.mesh.position, worldMouse).normalize().multiplyScalar(0.008 * (3 - dist));
                    ball.vel.add(force);
                }

                // Minimal movement
                if (ball.vel.length() < 0.001) {
                    ball.vel.set((Math.random() - 0.5) * 0.01, (Math.random() - 0.5) * 0.01, 0);
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
